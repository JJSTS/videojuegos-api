<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block head %}
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{{ href('/images/favicon.png') }}">
    <link href="{{ href('/webjars/bootstrap/dist/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet" type="text/css"/>
    {% endblock %}
</head>
<body>
    <div id="content">{% block content %} contenido por defecto {% endblock %} </div>
    <footer>
        {% block footer %}
        {% endblock %}
    </footer>
</body>
</html>
