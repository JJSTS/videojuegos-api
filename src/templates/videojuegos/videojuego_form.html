{%extends "fragments/base.html" %}

{% block content %}

    <div class="form-container">
        <h1>📝 Nuevo Videojuego</h1>
        <form method="post" action="/videojuegos/new" enctype="application/x-www-form-urlencoded">
            <div class="form-group">
                <label for="nombre">Nombre del Videojuego:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Introduce el nombre" required>
            </div>
            <div class="form-group">
                <label for="fecha_estreno">Fecha de lanzamiento:</label>
                <input type="date" id="fecha_lanzamiento" name="fecha_lanzamiento" required>
            </div>
            
            <button type="submit">Guardar Videojuego</button>
        </form>
        
        <a href="/videojuegos" class="back-link">← Volver a la lista de Videojuego</a>
    </div>
{% endblock %}
